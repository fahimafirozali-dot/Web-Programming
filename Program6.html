
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript String & Math Functions</title>
</head>

<body bgcolor="lavender">

<h1>STRING AND MATH FUNCTIONS</h1>
<h2>1.String Object Functions</h2>
<script>
var str=prompt("Enter a string:");
document.write("<b>Original String=</b>"+str+"<br><br>");
document.write("1.Length:"+str.length+"<br>");
document.write("2.Uppercase:"+str.toUpperCase()+"<br>");
document.write("3.Lowercase:"+ str.toLowerCase()+"<br>");
document.write("4.Character at position 1:"+str.charAt(1)+"<br>");
document.write("5.Index of Java:"+str.indexOf("java")+"<br>");
document.write("6.Slice:"+str.slice(0,5)+"<br>");
document.write("7.Replace:"+str.replace("Hello", "Welcome")+"<br>");
document.write("9.Concatenation:"+str.concat(" Programming")+"<br>");
document.write("10.Trim:"+" Hello ".trim()+"<br>");
</script>
<hr>
<h2>2.Math Object Functions</h2>
<script>
var num=Number(prompt("Enter a number:"));
document.write("<b>Original Number=</b>"+num+"<br><br>");
document.write("1.Absolute Value:"+Math.abs(num)+"<br>");
document.write("2.Round:"+Math.round(num)+"<br>");
document.write("3.Ceil:"+Math.ceil(num)+"<br>");
document.write("4.Floor:"+Math.floor(num)+"<br>");
document.write("5.Square Root:"+Math.sqrt(num)+"<br>");
document.write("6.Power to 3:"+Math.pow(num,3)+"<br>");
document.write("7.Maximum (10,20,30):"+Math.max(10,20,30)+"<br>");
document.write("8.Minimum (10,20,30):"+Math.min(10,20,30)+"<br>");
document.write("9.Random Number:"+Math.random()+"<br>");
document.write("10.PI Value:"+Math.PI+"<br>");
</script>
</body>
</html>
