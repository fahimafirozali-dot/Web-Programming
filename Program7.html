
<html>
<head>
    <title>Calendar Generator</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        #result {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 20px;
        }

        .month {
            background: white;
            padding: 10px;
            border-radius: 8px;
        }

        h3 {
            color: darkblue;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 7px;
            text-align: center;
            border: 1px solid #ddd;
        }

        th {
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <h2>Yearly Calendar</h2>

    Enter Year:
    <input type="number" id="year">

    <button onclick="generate()">Generate</button>

    <div id="result"></div>

    <script>
        function generate() {

            let year = document.getElementById("year").value;

            if (year == "") {
                alert("Enter a year");
                return;
            }

            let result = "";

            for (let m = 0; m < 12; m++) {

                let date = new Date(year, m, 1);
                let days = new Date(year, m + 1, 0).getDate();

                result += "<div class='month'>";

                result += "<h3>" +
                    date.toLocaleString("en", {month: "long"}) +
                    "</h3>";

                result += "<table><tr>";

                let week = ["Sun", "Mon", "Tue", "Wed",
                            "Thu", "Fri", "Sat"];

                for (let d of week) {
                    result += "<th>" + d + "</th>";
                }

                result += "</tr><tr>";

                for (let i = 0; i < date.getDay(); i++) {
                    result += "<td></td>";
                }

                for (let d = 1; d <= days; d++) {

                    result += "<td>" + d + "</td>";

                    if ((date.getDay() + d) % 7 == 0) {
                        result += "</tr><tr>";
                    }
                }

                result += "</tr></table></div>";
            }

            document.getElementById("result").innerHTML = result;
        }
    </script>

</body>
</html>
